<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0b1220" />
<title>RainAway 驱雨 — 找到晴朗的方向</title>
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin="" />
</head>
<body>
  <main class="app">
    <header class="top-bar">
      <div class="title">RainAway · 驱雨</div>
      <div class="subtitle" id="locText">正在定位…</div>
    </header>

    <section class="compass-wrap">
      <div class="compass" id="compass">
        <svg class="dial" viewBox="-100 -100 200 200" aria-hidden="true"></svg>
        <div class="center-label" id="centerLabel">--</div>
      </div>
    </section>

    <section class="advice" id="adviceCard">
      <div class="primary" id="primaryAdvice">点击下方按钮查询</div>
      <div class="secondary" id="secondaryAdvice"></div>
    </section>

    <section class="map-wrap">
      <div id="map" class="map" aria-label="地图视图"></div>
      <div class="legend">
        <span><i style="background:#22c55e"></i>无雨</span>
        <span><i style="background:#facc15"></i>小雨</span>
        <span><i style="background:#f97316"></i>中雨</span>
        <span><i style="background:#ef4444"></i>大雨</span>
      </div>
    </section>

    <footer class="controls">
      <button id="searchBtn" class="primary-btn">查询脱雨方向</button>
      <button id="speakBtn" class="secondary-btn" aria-label="语音播报">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor" aria-hidden="true">
          <path d="M3 10v4h4l5 5V5L7 10H3zm13.5 2c0-1.77-1-3.29-2.5-4.03v8.05c1.5-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77 0-4.28-2.99-7.86-7-8.77z"/>
        </svg>
      </button>
    </footer>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>
  <script src="app.js"></script>
</body>
</html>
