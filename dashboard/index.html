<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sydney Rental · AI 三分类</title>
<link rel="stylesheet" href="dashboard.css" />
</head>
<body>
<header class="topbar">
  <h1>Sydney Rental Triage</h1>
  <div class="status" id="status">loading…</div>
</header>

<section class="controls">
  <fieldset>
    <legend>Search</legend>
    <label>Suburbs <input id="suburbs" placeholder="Sydney,Bondi,Mosman" /></label>
    <label>Min beds <input id="minBeds" type="number" min="0" max="6" value="1" /></label>
    <label>Max beds <input id="maxBeds" type="number" min="0" max="6" value="3" /></label>
    <label>Max rent/wk <input id="maxRent" type="number" min="0" value="1500" /></label>
  </fieldset>
  <div class="buttons">
    <button id="scrapeBtn">1. Scrape</button>
    <button id="analyzeBtn">2. Analyze with AI</button>
    <button id="runBtn" class="primary">Run end-to-end</button>
    <button id="refreshBtn">Refresh</button>
    <button id="rubricBtn">Edit Rubric</button>
  </div>
</section>

<nav class="tabs">
  <button class="tab is-active" data-tab="DEAL">
    <span class="dot dot-deal"></span>Deals <span class="count" data-count="DEAL">0</span>
  </button>
  <button class="tab" data-tab="SUSPECT">
    <span class="dot dot-suspect"></span>Review queue <span class="count" data-count="SUSPECT">0</span>
  </button>
  <button class="tab" data-tab="DISCARD">
    <span class="dot dot-discard"></span>Discarded <span class="count" data-count="DISCARD">0</span>
  </button>
  <button class="tab" data-tab="UNANALYZED">
    <span class="dot"></span>Unanalyzed <span class="count" data-count="UNANALYZED">0</span>
  </button>
</nav>

<main id="grid" class="grid"></main>

<template id="cardTpl">
  <article class="card">
    <div class="badge"></div>
    <div class="thumb"></div>
    <div class="body">
      <h3 class="addr"></h3>
      <div class="meta"></div>
      <div class="rent"></div>
      <p class="headline"></p>
      <details class="reasoning">
        <summary>Reasoning</summary>
        <p class="reasoning-text"></p>
        <div class="criteria"></div>
      </details>
      <div class="pros"></div>
      <div class="cons"></div>
      <div class="actions">
        <button class="btn-deal" data-action="CONFIRMED_DEAL">✓ Confirm Deal</button>
        <button class="btn-discard" data-action="CONFIRMED_DISCARD">✗ Reject</button>
        <button class="btn-undo" data-action="undo">Undo</button>
      </div>
      <a class="link" target="_blank" rel="noopener">View listing →</a>
    </div>
  </article>
</template>

<dialog id="rubricDialog" class="rubric-dialog">
  <form method="dialog">
    <h2>Triage Rubric</h2>
    <p class="rubric-help">这段会注入 Claude 的 system prompt。改完保存后下次 Analyze 会用新版本。</p>
    <textarea id="rubricText" rows="20"></textarea>
    <div class="rubric-actions">
      <button type="button" id="rubricSave" class="primary">Save</button>
      <button type="button" id="rubricCancel">Cancel</button>
    </div>
  </form>
</dialog>

<script src="dashboard.js"></script>
</body>
</html>
