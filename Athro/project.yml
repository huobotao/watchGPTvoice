name: Athro
options:
  bundleIdPrefix: com.athro
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  AthroApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AthroApp
      - path: Shared
    info:
      path: AthroApp/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.athro.app
        PRODUCT_NAME: Athro
        INFOPLIST_FILE: AthroApp/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_EMIT_LOC_STRINGS: YES
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: AthroWidget

  AthroWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AthroWidget
      - path: Shared
    info:
      path: AthroWidget/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.athro.app.widget
        PRODUCT_NAME: AthroWidget
        INFOPLIST_FILE: AthroWidget/Info.plist
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: WidgetBackground
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework

  AthroWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: AthroWatch
      - path: Shared
    info:
      path: AthroWatch/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.athro.app.watchkitapp
        PRODUCT_NAME: AthroWatch
        INFOPLIST_FILE: AthroWatch/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "4"
        GENERATE_INFOPLIST_FILE: NO
        WATCHOS_DEPLOYMENT_TARGET: "10.0"

schemes:
  AthroApp:
    build:
      targets:
        AthroApp: all
        AthroWidget: [run, archive]
    run:
      config: Debug
    archive:
      config: Release

  AthroWatch:
    build:
      targets:
        AthroWatch: all
    run:
      config: Debug
    archive:
      config: Release
