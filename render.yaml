services:
  - type: web
    name: court-tool
    runtime: python
    plan: free
    rootDir: court-tool
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    envVars:
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: ASSEMBLYAI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: REPLICATE_API_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: APP_PASSWORD
        generateValue: true
      - key: CLAUDE_MODEL
        value: claude-opus-4-7
      - key: OPENAI_MODEL
        value: gpt-4o
      - key: GEMINI_MODEL
        value: gemini-2.5-pro
      - key: PYTHON_VERSION
        value: "3.11"
