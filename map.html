<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>澳洲穿越地图 · 自定义图层</title>

<!-- Leaflet 底图库（CDN，浏览器端加载，无需 API Key） -->
<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
  crossorigin=""
/>
<link rel="stylesheet" href="map.css" />
</head>
<body>
  <div id="map"></div>

  <!-- 图层控制面板 -->
  <aside class="panel" id="panel">
    <header class="panel-head">
      <h1>澳洲穿越图层</h1>
      <button class="panel-toggle" id="panelToggle" aria-label="折叠/展开">−</button>
    </header>

    <p class="panel-sub">勾选图层后，平移/缩放地图会按当前视野自动加载数据。</p>

    <div class="layers" id="layers"><!-- JS 注入图层行 --></div>

    <div class="panel-foot">
      <div class="status" id="status">就绪</div>
      <p class="credit">
        数据 © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> 贡献者 ·
        查询经 <a href="https://overpass-api.de/" target="_blank" rel="noopener">Overpass API</a>
      </p>
    </div>
  </aside>

  <!-- 提示气泡 -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script src="map.js"></script>
</body>
</html>
