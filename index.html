<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#EDEDED" />
  <title>微信</title>
  <link rel="stylesheet" href="assets/css/wechat.css" />
  <link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%2307C160'/><text x='32' y='44' font-size='38' text-anchor='middle' fill='white' font-family='-apple-system'>微</text></svg>" />
</head>
<body>
  <div id="device">
    <div id="status-bar">
      <div class="sb-time">9:41</div>
      <div class="sb-notch"></div>
      <div class="sb-right">
        <svg viewBox="0 0 18 12" width="17" height="11"><path fill="currentColor" d="M1.5 9.5h2v1h-2zM5 8h2v2.5H5zM8.5 6h2v4.5h-2zM12 4h2v6.5h-2zM15.5 2h2v8.5h-2z"/></svg>
        <svg viewBox="0 0 16 12" width="16" height="11"><path fill="none" stroke="currentColor" stroke-width="1.1" d="M1 4.5 A 8 6 0 0 1 15 4.5 M3.2 6.7 A 5 4 0 0 1 12.8 6.7 M5.4 8.9 A 2 1.5 0 0 1 10.6 8.9"/><circle cx="8" cy="10.5" r="0.9" fill="currentColor"/></svg>
        <div class="sb-battery"><div class="sb-battery-level"></div><div class="sb-battery-cap"></div></div>
      </div>
    </div>

    <div id="page-stack"></div>

    <div id="tabbar">
      <a class="tab" data-tab="chats" href="#/chats">
        <div class="tab-icon" data-icon="chats"></div>
        <div class="tab-label">微信</div>
        <div class="tab-badge" data-badge="chats"></div>
      </a>
      <a class="tab" data-tab="contacts" href="#/contacts">
        <div class="tab-icon" data-icon="contacts"></div>
        <div class="tab-label">通讯录</div>
        <div class="tab-badge" data-badge="contacts"></div>
      </a>
      <a class="tab" data-tab="discover" href="#/discover">
        <div class="tab-icon" data-icon="discover"></div>
        <div class="tab-label">发现</div>
        <div class="tab-badge" data-badge="discover"></div>
      </a>
      <a class="tab" data-tab="me" href="#/me">
        <div class="tab-icon" data-icon="me"></div>
        <div class="tab-label">我</div>
        <div class="tab-badge" data-badge="me"></div>
      </a>
      <div class="tab-home-indicator"></div>
    </div>
  </div>

  <div id="overlay-root"></div>
  <div id="toast-root"></div>

  <script src="assets/js/icons.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/views.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
