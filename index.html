<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0b0d12" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>替尔泊肽 / 司美格鲁肽 · 一键记录</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">

    <!-- 顶部：距上一次状态 -->
    <header class="status">
      <div class="status-card">
        <div class="status-label">距上一顿饭</div>
        <div class="status-value" id="sinceMeal">—</div>
      </div>
      <div class="status-card">
        <div class="status-label">距上一针</div>
        <div class="status-value" id="sinceShot">—</div>
      </div>
      <div class="status-card">
        <div class="status-label">最近体重</div>
        <div class="status-value" id="latestWeight">—</div>
      </div>
    </header>

    <!-- 三个大按钮：一键记录 -->
    <section class="actions">
      <button class="action action-meal" data-action="meal" aria-label="记录一顿饭">
        <span class="action-icon">🍽️</span>
        <span class="action-text">吃了一顿</span>
        <span class="action-hint" id="hintMeal">点一下记一顿</span>
      </button>

      <button class="action action-shot" data-action="shot" aria-label="记录打针">
        <span class="action-icon">💉</span>
        <span class="action-text">打了一针</span>
        <span class="action-hint" id="hintShot">替尔泊肽 / 司美格鲁肽</span>
      </button>

      <button class="action action-weight" data-action="weight" aria-label="记录体重">
        <span class="action-icon">⚖️</span>
        <span class="action-text">称了体重</span>
        <span class="action-hint" id="hintWeight">输入当前公斤数</span>
      </button>
    </section>

    <!-- 图表：体重 + 每日吃饭顿数 -->
    <section class="chart-section">
      <div class="section-head">
        <h2>近 30 天</h2>
        <div class="legend">
          <span class="legend-item"><span class="dot dot-weight"></span>体重</span>
          <span class="legend-item"><span class="dot dot-meal"></span>顿数</span>
          <span class="legend-item"><span class="dot dot-shot"></span>打针</span>
        </div>
      </div>
      <canvas id="chart" width="600" height="220" aria-label="体重与吃饭趋势图"></canvas>
    </section>

    <!-- 事件流水 -->
    <section class="log-section">
      <div class="section-head">
        <h2>最近记录</h2>
        <div class="log-tools">
          <button class="btn-mini" id="exportCsv">导出 CSV</button>
          <button class="btn-mini btn-danger" id="clearAll">清空</button>
        </div>
      </div>
      <ul class="log" id="log"></ul>
      <div class="empty" id="emptyHint">还没有记录。点上面的大按钮开始。</div>
    </section>

  </main>

  <!-- 弹窗：选药 / 输入剂量 -->
  <div class="modal" id="shotModal" aria-hidden="true">
    <div class="modal-card">
      <h3>打了哪一针？</h3>
      <div class="seg" role="radiogroup" id="shotDrug">
        <button class="seg-btn is-active" data-drug="tirzepatide">替尔泊肽</button>
        <button class="seg-btn" data-drug="semaglutide">司美格鲁肽</button>
      </div>
      <label class="field">
        <span>剂量 (mg)</span>
        <input id="shotDose" type="number" step="0.25" inputmode="decimal" placeholder="例 2.5 / 5 / 7.5" />
      </label>
      <div class="modal-row">
        <button class="btn-ghost" data-close>取消</button>
        <button class="btn-primary" id="shotSave">保存</button>
      </div>
    </div>
  </div>

  <!-- 弹窗：输入体重 -->
  <div class="modal" id="weightModal" aria-hidden="true">
    <div class="modal-card">
      <h3>当前体重</h3>
      <label class="field">
        <span>公斤</span>
        <input id="weightValue" type="number" step="0.1" inputmode="decimal" placeholder="例 78.5" />
      </label>
      <div class="modal-row">
        <button class="btn-ghost" data-close>取消</button>
        <button class="btn-primary" id="weightSave">保存</button>
      </div>
    </div>
  </div>

  <!-- 弹窗：撤销/编辑某条 -->
  <div class="modal" id="editModal" aria-hidden="true">
    <div class="modal-card">
      <h3>这条记录</h3>
      <div id="editSummary" class="edit-summary"></div>
      <div class="modal-row">
        <button class="btn-ghost" data-close>关闭</button>
        <button class="btn-danger" id="editDelete">删除</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
