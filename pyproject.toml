[project]
name = "icloud-ai"
version = "0.1.0"
description = "Ask an LLM about your iCloud-synced Photos / Contacts / Calendar on macOS."
requires-python = ">=3.10"
dependencies = [
    "osxphotos>=0.69",
    "anthropic>=0.40",
    "openai>=1.50",
    "httpx>=0.27",
]

[project.scripts]
icloud-ai = "icloud_ai.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["icloud_ai*"]
