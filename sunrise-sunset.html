<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>日出日落时刻</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b1220;
    --card: #131c2e;
    --card-2: #1a2540;
    --text: #e8eefc;
    --muted: #8a98b8;
    --accent: #ffb86b;
    --accent-2: #6cb6ff;
    --past: #f4a47d;
    --future: #6cb6ff;
    --phase: #ffb86b;
    --border: rgba(255,255,255,0.08);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased; }
  body { min-height: 100vh; padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom); }
  .wrap { max-width: 520px; margin: 0 auto; padding: 20px 0 40px; }
  h1 { font-size: 22px; margin: 0 0 16px; font-weight: 600; letter-spacing: 0.5px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .refresh { background: transparent; color: var(--accent-2); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 12px; font-size: 13px; cursor: pointer; }

  .meta { background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 14px 16px; margin-bottom: 16px; }
  .meta .row { display: flex; justify-content: space-between; align-items: baseline; padding: 4px 0; font-size: 14px; gap: 12px; }
  .meta .row .label { color: var(--muted); flex-shrink: 0; }
  .meta .row .val { font-variant-numeric: tabular-nums; text-align: right; }
  .meta .row .val small { color: var(--muted); font-size: 12px; margin-left: 6px; }
  .meta .row .val .pctchip { color: var(--phase); margin-left: 6px; font-weight: 600; }
  .meta .row.addr .val { text-align: right; color: var(--text); font-variant-numeric: normal; }
  .status { font-size: 13px; color: var(--muted); padding: 4px 0; }
  .status.err { color: #ff8a8a; }

  .now-phase { background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 14px 16px; margin-bottom: 16px; }
  .now-phase .nowtitle { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .now-phase .ph-name { font-size: 15px; font-weight: 600; }
  .now-phase .ph-pct { font-variant-numeric: tabular-nums; color: var(--phase); font-weight: 600; }
  .now-phase .ph-sub { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .now-phase .ph-bar { margin-top: 10px; height: 6px; background: rgba(255,255,255,0.08);
    border-radius: 3px; overflow: hidden; }
  .now-phase .ph-fill { height: 100%; border-radius: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    transition: width 0.6s ease-out; }

  .illum-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 14px 16px; margin-bottom: 16px; }
  .illum-card .illum-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .illum-card .illum-title { font-size: 14px; font-weight: 600; }
  .illum-card .illum-pct { color: var(--phase); font-weight: 600; font-variant-numeric: tabular-nums; }
  .illum-card .illum-sub { font-size: 12px; color: var(--muted); margin-top: 4px; font-variant-numeric: tabular-nums; }
  .illum-card .illum-chart { width: 100%; height: 90px; margin-top: 10px; display: block; }
  .illum-card .illum-axis { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); margin-top: 2px; }

  .group { background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    margin-bottom: 16px; overflow: hidden; }
  .group h2 { margin: 0; padding: 14px 16px; font-size: 15px; font-weight: 600;
    background: var(--card-2); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
  .group h2 .emoji { font-size: 18px; }
  .group h2 .tag { font-size: 11px; color: var(--accent-2); background: rgba(108,182,255,0.12);
    padding: 2px 8px; border-radius: 99px; margin-left: auto; font-weight: 500; }
  .item { display: grid; grid-template-columns: 1fr auto auto; gap: 12px; align-items: baseline;
    padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .item:last-child { border-bottom: none; }
  .item.passed .time, .item.passed .name { opacity: 0.55; }
  .name { font-size: 15px; }
  .name small { color: var(--muted); font-size: 12px; margin-left: 6px; font-weight: normal; }
  .time { font-size: 17px; font-variant-numeric: tabular-nums; font-weight: 600; letter-spacing: 0.5px; }
  .delta { font-size: 13px; font-variant-numeric: tabular-nums; min-width: 92px; text-align: right; }
  .delta.past { color: var(--past); }
  .delta.future { color: var(--future); }
  .na { color: var(--muted); font-size: 13px; }

  .inrow-bar { padding: 6px 16px 10px; background: linear-gradient(90deg, rgba(255,184,107,0.06), rgba(108,182,255,0.06));
    border-bottom: 1px solid var(--border); position: relative; }
  .inrow-bar .lbl { font-size: 11px; color: var(--phase); display: flex; justify-content: space-between; margin-bottom: 4px; }
  .inrow-bar .track { height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden; }
  .inrow-bar .fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width 0.6s ease-out; }

  .sky-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    margin-bottom: 16px; padding: 12px 14px 14px; }
  .sky-card .sky-head { display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 8px; }
  .sky-card .sky-title { font-size: 14px; color: var(--text); font-weight: 600; }
  .sky-card .sky-hint  { font-size: 11px; color: var(--muted); }
  .sky3d-canvas { position: relative; width: 100%; aspect-ratio: 1 / 1; max-width: 360px;
    margin: 0 auto; background: radial-gradient(circle at 50% 40%, #0b1830, #050a14 70%);
    border-radius: 12px; overflow: hidden; touch-action: none; }
  .sky3d-canvas canvas { display: block; width: 100% !important; height: 100% !important; }
  .sky3d-loading { position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; color: var(--muted); font-size: 12px; pointer-events: none; }
  .sky-card .sky-legend { display: flex; flex-wrap: wrap; justify-content: center; margin-top: 8px;
    font-size: 11px; color: var(--muted); gap: 6px 14px; }
  .sky-card .sky-legend .lg-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    vertical-align: middle; margin-right: 4px; }

  .manual { background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 14px 16px; margin-bottom: 16px; }
  .manual p { margin: 0 0 10px; font-size: 14px; color: var(--muted); }
  .manual .inputs { display: flex; gap: 8px; }
  .manual input { flex: 1; min-width: 0; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font-size: 15px;
    font-variant-numeric: tabular-nums; }
  .manual button { background: var(--accent); color: #1a1200; border: none; border-radius: 8px;
    padding: 10px 14px; font-size: 15px; font-weight: 600; cursor: pointer; }
  .footer { margin-top: 20px; text-align: center; font-size: 12px; color: var(--muted); }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <h1>日出日落时刻</h1>
    <button class="refresh" id="btn-refresh">刷新位置</button>
  </div>
  <div id="status" class="status">正在获取位置…</div>

  <div class="meta" id="meta" hidden>
    <div class="row"><span class="label">当前时间</span><span class="val" id="now-time">—</span></div>
    <div class="row"><span class="label">当前位置</span><span class="val" id="pos">—</span></div>
    <div class="row addr"><span class="label">地址</span><span class="val" id="addr">查询中…</span></div>
    <div class="row"><span class="label">时区</span><span class="val" id="tz">—</span></div>
    <div class="row"><span class="label">太阳高度</span><span class="val" id="sun-alt">—</span></div>
  </div>

  <div class="now-phase" id="now-phase" hidden>
    <div class="nowtitle">
      <span class="ph-name" id="ph-name">—</span>
      <span class="ph-pct" id="ph-pct">—</span>
    </div>
    <div class="ph-sub" id="ph-sub"></div>
    <div class="ph-bar"><div class="ph-fill" id="ph-fill"></div></div>
  </div>

  <div class="illum-card" id="illum-card" hidden>
    <div class="illum-head">
      <div class="illum-title">🌞 地面光照 · 理想晴空</div>
      <div class="illum-pct" id="illum-pct">—</div>
    </div>
    <div class="illum-sub">
      <span id="illum-cur">— lux</span>
      <span> / 24h 内最大 <span id="illum-max">— lux</span></span>
    </div>
    <svg id="illum-chart" class="illum-chart" viewBox="0 0 320 90" preserveAspectRatio="none"></svg>
    <div class="illum-axis">
      <span>−12h</span><span>−6h</span><span>现在</span><span>+6h</span><span>+12h</span>
    </div>
  </div>

  <div class="manual" id="manual" hidden>
    <p>无法自动获取位置，可手动输入经纬度（十进制度）：</p>
    <div class="inputs">
      <input id="in-lat" type="number" step="0.0001" placeholder="纬度  例 31.2304">
      <input id="in-lng" type="number" step="0.0001" placeholder="经度  例 121.4737">
      <button id="btn-go">计算</button>
    </div>
  </div>

  <div id="group-before"></div>

  <div id="sky3d-card" class="sky-card">
    <div class="sky-head">
      <div class="sky-title">太阳 3D 轨迹 · 前后 12 小时</div>
      <div class="sky-hint">手指拖动可旋转</div>
    </div>
    <div id="sky3d-canvas" class="sky3d-canvas">
      <div class="sky3d-loading">3D 场景加载中…</div>
    </div>
    <div class="sky-legend">
      <span><span class="lg-dot" style="background:#ffd87b"></span>白天轨迹</span>
      <span><span class="lg-dot" style="background:#5a6a90"></span>地平线下</span>
      <span><span class="lg-dot" style="background:#ff8e5a"></span>当前太阳</span>
      <span><span class="lg-dot" style="background:#7a96c8"></span>地平线 N/E/S/W</span>
    </div>
  </div>

  <div id="group-after"></div>

  <div class="footer">每秒刷新时间 · 每 3 分钟刷新位置 · 位置不会上传</div>
</div>

<script>
(function () {
  'use strict';

  // ---------- 日出日落算法（参考 SunCalc, BSD-2-Clause, by Vladimir Agafonkin） ----------
  const PI = Math.PI, rad = PI / 180;
  const dayMs = 86400000, J1970 = 2440588, J2000 = 2451545;
  const e = rad * 23.4397;

  const toJulian = d => d.valueOf() / dayMs - 0.5 + J1970;
  const fromJulian = j => new Date((j + 0.5 - J1970) * dayMs);
  const toDays = d => toJulian(d) - J2000;

  const rightAscension = (l, b) =>
    Math.atan2(Math.sin(l) * Math.cos(e) - Math.tan(b) * Math.sin(e), Math.cos(l));
  const declination = (l, b) =>
    Math.asin(Math.sin(b) * Math.cos(e) + Math.cos(b) * Math.sin(e) * Math.sin(l));
  const siderealTime = (d, lw) => rad * (280.16 + 360.9856235 * d) - lw;

  const solarMeanAnomaly = d => rad * (357.5291 + 0.98560028 * d);
  const eclipticLongitude = M => {
    const C = rad * (1.9148 * Math.sin(M) + 0.02 * Math.sin(2 * M) + 0.0003 * Math.sin(3 * M));
    const P = rad * 102.9372;
    return M + C + P + PI;
  };

  const J0 = 0.0009;
  const julianCycle = (d, lw) => Math.round(d - J0 - lw / (2 * PI));
  const approxTransit = (Ht, lw, n) => J0 + (Ht + lw) / (2 * PI) + n;
  const solarTransitJ = (ds, M, L) =>
    J2000 + ds + 0.0053 * Math.sin(M) - 0.0069 * Math.sin(2 * L);

  function getSunTimes(date, lat, lng, altDeg) {
    const lw = rad * -lng;
    const phi = rad * lat;
    const d = toDays(date);
    const n = julianCycle(d, lw);
    const ds = approxTransit(0, lw, n);
    const M = solarMeanAnomaly(ds);
    const L = eclipticLongitude(M);
    const dec = declination(L, 0);
    const Jnoon = solarTransitJ(ds, M, L);
    const h = altDeg * rad;
    const cosW = (Math.sin(h) - Math.sin(phi) * Math.sin(dec)) / (Math.cos(phi) * Math.cos(dec));
    if (cosW < -1 || cosW > 1) return { rise: null, set: null };
    const w = Math.acos(cosW);
    const Jset = solarTransitJ(approxTransit(w, lw, n), M, L);
    const Jrise = Jnoon - (Jset - Jnoon);
    return { rise: fromJulian(Jrise), set: fromJulian(Jset) };
  }

  function getSunPos(date, lat, lng) {
    const lw = rad * -lng;
    const phi = rad * lat;
    const d = toDays(date);
    const M = solarMeanAnomaly(d);
    const L = eclipticLongitude(M);
    const dec = declination(L, 0);
    const ra = rightAscension(L, 0);
    const H = siderealTime(d, lw) - ra;
    return {
      alt: Math.asin(Math.sin(phi) * Math.sin(dec) + Math.cos(phi) * Math.cos(dec) * Math.cos(H)),
      az:  Math.atan2(Math.sin(H), Math.cos(H) * Math.sin(phi) - Math.tan(dec) * Math.cos(phi)),
    };
  }

  // 给 3D 模块用
  window.__sun = { getSunPos, PI };

  function getSunAltitudeRad(date, lat, lng) {
    return getSunPos(date, lat, lng).alt;
  }

  // ---------- 配置 ----------
  const ANGLES = [
    { key: 'astro', riseName: '天文晨光', setName: '天文暮光', alt: -18,     hint: '−18°' },
    { key: 'naut',  riseName: '航海晨光', setName: '航海暮光', alt: -12,     hint: '−12°' },
    { key: 'civil', riseName: '民用晨光', setName: '民用暮光', alt: -6,      hint: '−6°'  },
    { key: 'horiz', riseName: '日出',     setName: '日落',     alt: -0.833,  hint: '0°（含折射）' },
  ];

  const PHASES = [
    { name: '天文', low: -18,     high: -12     },
    { name: '航海', low: -12,     high: -6      },
    { name: '民用', low: -6,      high: -0.833  },
  ];

  function findNextEvent(now, lat, lng, which) {
    const anchorAlt = which === 'rise' ? -0.833 : -18;
    for (const off of [0, 1, 2, 3]) {
      const d = new Date(now.getTime() + off * dayMs);
      const anchorT = getSunTimes(d, lat, lng, anchorAlt)[which];
      if (anchorT && anchorT >= now) {
        return ANGLES.map(angle => {
          const t = getSunTimes(d, lat, lng, angle.alt)[which];
          return { angle, time: t, passed: t && t < now };
        });
      }
    }
    return ANGLES.map(angle => ({ angle, time: null, passed: false }));
  }

  function currentPhase(date, lat, lng) {
    const altRad = getSunAltitudeRad(date, lat, lng);
    const altDeg = altRad / rad;
    const altSoon = getSunAltitudeRad(new Date(date.getTime() + 60000), lat, lng) / rad;
    const rateDegPerMin = altSoon - altDeg;
    const rising = rateDegPerMin > 0;

    if (altDeg > -0.833) return { kind: 'day', altDeg, rising, rateDegPerMin };
    if (altDeg < -18)    return { kind: 'night', altDeg, rising, rateDegPerMin };

    const seg = PHASES.find(p => altDeg > p.low && altDeg <= p.high) || PHASES[0];
    const range = seg.high - seg.low;
    const segPct = rising
      ? (altDeg - seg.low) / range
      : (seg.high - altDeg) / range;
    const overallPct = rising
      ? (altDeg - (-18)) / (-0.833 - (-18))
      : (-0.833 - altDeg) / (-0.833 - (-18));
    return {
      kind: rising ? 'dawn' : 'dusk',
      altDeg, rising, rateDegPerMin,
      segName: seg.name, segLow: seg.low, segHigh: seg.high,
      pct: Math.max(0, Math.min(1, segPct)),
      overallPct: Math.max(0, Math.min(1, overallPct)),
    };
  }

  // 当日太阳高度角变化的最大速率（绝对值，度/分），按 lat/lng/日期缓存
  let cachedMaxRate = { key: null, val: 0 };
  function getMaxAltRate(now, lat, lng) {
    const dayKey = Math.floor(now.getTime() / dayMs);
    const key = `${lat.toFixed(2)}|${lng.toFixed(2)}|${dayKey}`;
    if (cachedMaxRate.key === key) return cachedMaxRate.val;
    let maxR = 0;
    for (let m = -12 * 60; m < 12 * 60; m += 5) {
      const t1 = new Date(now.getTime() + m * 60000);
      const a1 = getSunPos(t1, lat, lng).alt / rad;
      const a2 = getSunPos(new Date(t1.getTime() + 60000), lat, lng).alt / rad;
      const r = Math.abs(a2 - a1);
      if (r > maxR) maxR = r;
    }
    cachedMaxRate = { key, val: maxR };
    return maxR;
  }

  // 理想晴空地面水平照度（lux），范围 ~0.0006 到 ~110000
  // 物理：日地大气外 ~128000 lx 法向 × Kasten-Young 大气质量 × Bouguer 透过率 × sin(alt)（投影到水平）
  //       + 天空漫射；地平线下 0~−18° 用经验对数过渡，−18° 以下取夜空底（星光 ~0.0006 lx）
  // 关键数据点：alt=90° ~108k, 60° ~91k, 30° ~47k, 10° ~11k, 0° ~480,
  //              −6° ~3.4, −12° ~0.008, −18° ~0.0006 lx（与现实接近）
  function illuminance(altDeg) {
    // ---- 漫射天空背景，从星光到白天平滑过渡 ----
    let diffuse;
    if (altDeg > 6) {
      diffuse = 0.15 * 128000 * Math.sin(altDeg * PI / 180);
    } else if (altDeg > -0.833) {
      // 0 ~ 6°：400 → ~2007 lx 的对数插值
      const hi = 0.15 * 128000 * Math.sin(6 * PI / 180);
      const u = (altDeg + 0.833) / 6.833;
      diffuse = 400 * Math.pow(hi / 400, u);
    } else if (altDeg > -6) {
      const u = (altDeg + 6) / 5.167;
      diffuse = 3.4 * Math.pow(400 / 3.4, u);
    } else if (altDeg > -12) {
      const u = (altDeg + 12) / 6;
      diffuse = 0.008 * Math.pow(3.4 / 0.008, u);
    } else if (altDeg > -18) {
      const u = (altDeg + 18) / 6;
      diffuse = 0.0006 * Math.pow(0.008 / 0.0006, u);
    } else {
      diffuse = 0.0006;
    }
    // ---- 直射分量：仅日出（alt > 0）时有 ----
    let direct = 0;
    if (altDeg > 0) {
      const sinAlt = Math.sin(altDeg * PI / 180);
      const am = 1 / (sinAlt + 0.50572 * Math.pow(altDeg + 6.07995, -1.6364));
      direct = 128000 * Math.pow(0.7, Math.pow(am, 0.678)) * sinAlt;
    }
    return direct + diffuse;
  }

  // 构建 24h 光照曲线 SVG + 统计值
  function buildIllumChart(now, lat, lng) {
    const W = 320, H = 90;
    const padL = 4, padR = 4, padT = 4, padB = 4;
    const cw = W - padL - padR, ch = H - padT - padB;

    const samples = [];
    let maxLux = 0;
    for (let m = -12 * 60; m <= 12 * 60; m += 5) {
      const t = new Date(now.getTime() + m * 60000);
      const alt = getSunPos(t, lat, lng).alt / rad;
      const lux = illuminance(alt);
      samples.push({ m, lux });
      if (lux > maxLux) maxLux = lux;
    }
    const curLux = illuminance(getSunPos(now, lat, lng).alt / rad);

    // 对数 y 轴：让低光段也能看出变化
    const yMin = -3.2;                   // 约 6e-4 lux
    const yMax = Math.log10(maxLux + 1) + 0.05;
    const yRange = yMax - yMin;
    const toX = m => padL + ((m + 12 * 60) / (24 * 60)) * cw;
    const toY = lux => padT + ch - ((Math.log10(Math.max(lux, 1e-4)) - yMin) / yRange) * ch;

    const pathD = samples.map((p, i) =>
      `${i === 0 ? 'M' : 'L'}${toX(p.m).toFixed(1)},${toY(p.lux).toFixed(1)}`).join(' ');
    const areaD = pathD +
      ` L${toX(12 * 60).toFixed(1)},${(padT + ch).toFixed(1)}` +
      ` L${toX(-12 * 60).toFixed(1)},${(padT + ch).toFixed(1)} Z`;

    const cx = toX(0), cy = toY(curLux);

    // 横向参考线（10^0, 10^2, 10^4 lux）
    const refs = [0, 2, 4].filter(p => p >= yMin && p <= yMax).map(p => {
      const y = padT + ch - ((p - yMin) / yRange) * ch;
      return `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W - padR}" y2="${y.toFixed(1)}" stroke="rgba(255,255,255,0.05)" stroke-dasharray="2 3"/>` +
             `<text x="${W - padR - 2}" y="${(y - 1).toFixed(1)}" text-anchor="end" fill="#5a6a90" font-size="9">10^${p} lux</text>`;
    }).join('');

    const svgInner = `
      <defs>
        <linearGradient id="illum-area" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ffd87b" stop-opacity="0.55"/>
          <stop offset="100%" stop-color="#ffd87b" stop-opacity="0"/>
        </linearGradient>
      </defs>
      ${refs}
      <path d="${areaD}" fill="url(#illum-area)"/>
      <path d="${pathD}" fill="none" stroke="#ffd87b" stroke-width="1.5"/>
      <line x1="${cx.toFixed(1)}" y1="${padT}" x2="${cx.toFixed(1)}" y2="${(padT + ch).toFixed(1)}"
            stroke="#6cb6ff" stroke-width="1" stroke-dasharray="3 3" opacity="0.7"/>
      <circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="4" fill="#ffe27a" stroke="#fff" stroke-width="1"/>
    `;

    return {
      svgInner,
      curLux, maxLux,
      pct: maxLux > 0 ? (curLux / maxLux * 100) : 0,
    };
  }

  function fmtLux(v) {
    if (v >= 10000) return Math.round(v / 100) / 10 + ' 万 lux';
    if (v >= 1000)  return Math.round(v).toLocaleString() + ' lux';
    if (v >= 10)    return v.toFixed(0) + ' lux';
    if (v >= 1)     return v.toFixed(1) + ' lux';
    if (v >= 0.01)  return v.toFixed(2) + ' lux';
    return v.toExponential(1).replace('e', 'e') + ' lux';
  }

  function fmtPct(p) {
    if (p >= 10) return p.toFixed(1) + '%';
    if (p >= 1)  return p.toFixed(2) + '%';
    if (p >= 0.01) return p.toFixed(2) + '%';
    if (p > 0)   return p.toExponential(1) + '%';
    return '0%';
  }

  // 白天/夜晚进度：白天 = horizon-rise → horizon-set；夜晚 = astro-set → astro-rise（真天文夜）
  function dayNightProgress(now, lat, lng, kind) {
    const targetAlt = kind === 'day' ? -0.833 : -18;
    let start = null, end = null;
    for (const off of [-2, -1, 0, 1, 2]) {
      const d = new Date(now.getTime() + off * dayMs);
      const t = getSunTimes(d, lat, lng, targetAlt);
      if (kind === 'day') {
        if (t.rise && t.rise <= now && (!start || t.rise > start)) start = t.rise;
        if (t.set  && t.set  >  now && (!end   || t.set  < end))   end   = t.set;
      } else {
        if (t.set  && t.set  <= now && (!start || t.set  > start)) start = t.set;
        if (t.rise && t.rise >  now && (!end   || t.rise < end))   end   = t.rise;
      }
    }
    if (!start || !end || end <= start) return null;
    return { start, end, pct: Math.max(0, Math.min(1, (now - start) / (end - start))) };
  }

  // ---------- UI helpers ----------
  const $ = id => document.getElementById(id);
  const pad2 = n => String(n).padStart(2, '0');
  const fmtClock = d => `${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`;
  const fmtHM    = d => `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;

  function fmtAgo(ms) {
    const s = Math.max(0, Math.round(ms / 1000));
    if (s < 60) return s + ' 秒前';
    if (s < 3600) return Math.round(s / 60) + ' 分前';
    return Math.round(s / 3600) + ' 小时前';
  }

  function fmtDelta(target, now) {
    const diffS = Math.round((target - now) / 1000);
    const abs = Math.abs(diffS);
    const suffix = diffS >= 0 ? '后' : '前';
    const cls = diffS >= 0 ? 'future' : 'past';
    let text;
    if (abs < 60) text = abs + ' 秒';
    else if (abs < 3600) {
      const m = Math.floor(abs / 60), s = abs % 60;
      text = m + ' 分 ' + pad2(s) + ' 秒';
    } else if (abs < dayMs / 1000) {
      const h = Math.floor(abs / 3600), m = Math.floor((abs % 3600) / 60);
      text = h + ' 小时 ' + m + ' 分';
    } else {
      const d = Math.floor(abs / 86400), h = Math.floor((abs % 86400) / 3600);
      text = d + ' 天 ' + h + ' 小时';
    }
    return { text: text + suffix, cls };
  }

  function fmtRate(rateAbs) {
    return rateAbs.toFixed(3).replace(/0+$/, '').replace(/\.$/, '') + '°/分';
  }

  // ---------- 反向地理编码（Nominatim / OpenStreetMap，免 key，英文，门牌号精度） ----------
  let cachedAddr = { lat: null, lng: null, text: null };
  let addrInFlight = false;
  async function lookupAddress(lat, lng) {
    if (cachedAddr.lat != null) {
      if (Math.abs(lat - cachedAddr.lat) < 0.0003 && Math.abs(lng - cachedAddr.lng) < 0.0003) {
        return cachedAddr.text;
      }
    }
    if (addrInFlight) return null;
    addrInFlight = true;
    try {
      const url = `https://nominatim.openstreetmap.org/reverse` +
        `?lat=${lat}&lon=${lng}&format=jsonv2&zoom=18&addressdetails=1&accept-language=en`;
      const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const d = await res.json();
      let text = d.display_name || '';
      // Fall back to assembling from address parts if display_name missing
      if (!text && d.address) {
        const a = d.address;
        const parts = [
          a.house_number && a.road ? `${a.house_number} ${a.road}` : a.road,
          a.neighbourhood || a.suburb,
          a.city || a.town || a.village,
          a.state, a.country,
        ].filter(Boolean);
        text = parts.join(', ');
      }
      text = text || '(unknown)';
      cachedAddr = { lat, lng, text };
      $('addr').textContent = text;
      return text;
    } catch (err) {
      $('addr').textContent = '(lookup failed)';
      return null;
    } finally {
      addrInFlight = false;
    }
  }

  // ---------- state ----------
  let state = {
    lat: null, lng: null,
    posUpdatedAt: null,
    posSource: '',
    posRefreshTimer: null,
  };
  const POS_REFRESH_MS = 3 * 60 * 1000;

  function setStatus(msg, isErr) {
    const el = $('status');
    el.textContent = msg || '';
    el.className = 'status' + (isErr ? ' err' : '');
    el.style.display = msg ? '' : 'none';
  }

  function buildGroupHTML(which, items, phase) {
    const emoji = which === 'rise' ? '🌅' : '🌇';
    const title = which === 'rise' ? '最近的日出' : '最近的日落';
    const showInRow = phase &&
      ((phase.kind === 'dawn' && which === 'rise') ||
       (phase.kind === 'dusk' && which === 'set'));
    let insertAfterKey = null;
    if (showInRow) {
      if (which === 'rise') {
        const lowKeyMap = { '天文': 'astro', '航海': 'naut', '民用': 'civil' };
        insertAfterKey = lowKeyMap[phase.segName];
      } else {
        const highKeyMap = { '民用': 'horiz', '航海': 'civil', '天文': 'naut' };
        insertAfterKey = highKeyMap[phase.segName];
      }
    }

    const now = new Date();
    let rows = '';
    items.forEach(({ angle, time, passed }) => {
      const nameLbl = which === 'rise' ? angle.riseName : angle.setName;
      if (!time) {
        rows += `<div class="item"><div class="name">${nameLbl}<small>${angle.hint}</small></div>
          <div class="na" style="grid-column: 2 / span 2;">当日无此现象（极昼/极夜）</div></div>`;
      } else {
        const d = fmtDelta(time, now);
        rows += `<div class="item ${passed ? 'passed' : ''}">
          <div class="name">${nameLbl}<small>${angle.hint}</small></div>
          <div class="time">${fmtHM(time)}</div>
          <div class="delta ${d.cls}">${d.text}</div>
        </div>`;
      }
      if (showInRow && insertAfterKey === angle.key) {
        const pct = Math.round(phase.pct * 100);
        const segLbl = phase.kind === 'dawn'
          ? phase.segName + '晨光中'
          : phase.segName + '暮光中';
        rows += `<div class="inrow-bar">
          <div class="lbl"><span>${segLbl}</span><span>${pct}%</span></div>
          <div class="track"><div class="fill" style="width:${pct}%"></div></div>
        </div>`;
      }
    });

    const horiz = items.find(it => it.angle.key === 'horiz');
    const tag = horiz && horiz.time ? fmtDelta(horiz.time, now).text : '';

    return `<div class="group">
      <h2><span class="emoji">${emoji}</span> ${title}<span class="tag">${tag}</span></h2>
      ${rows}
    </div>`;
  }

  function render() {
    const now = new Date();
    $('now-time').textContent =
      `${now.getFullYear()}-${pad2(now.getMonth() + 1)}-${pad2(now.getDate())} ${fmtClock(now)}`;
    if (state.lat == null) return;

    const posStr = `${state.lat.toFixed(4)}°, ${state.lng.toFixed(4)}°`;
    const ago = state.posUpdatedAt ? ` <small>${fmtAgo(now - state.posUpdatedAt)}</small>` : '';
    $('pos').innerHTML = posStr + ago;
    try { $('tz').textContent = Intl.DateTimeFormat().resolvedOptions().timeZone || '—'; }
    catch (_) { $('tz').textContent = '—'; }

    const phase = currentPhase(now, state.lat, state.lng);
    const rateAbs = Math.abs(phase.rateDegPerMin);
    const maxRate = getMaxAltRate(now, state.lat, state.lng);
    const ratePct = maxRate > 0 ? Math.round(rateAbs / maxRate * 100) : 0;
    $('sun-alt').innerHTML =
      `${phase.altDeg.toFixed(2)}°  ${phase.rising ? '↑' : '↓'} ${fmtRate(rateAbs)}` +
      `<span class="pctchip">${ratePct}%</span>`;

    // 当前相位卡片
    const np = $('now-phase');
    np.hidden = false;
    if (phase.kind === 'day') {
      const dn = dayNightProgress(now, state.lat, state.lng, 'day');
      $('ph-name').innerHTML = '☀️ 白天';
      if (dn) {
        const pct = Math.round(dn.pct * 100);
        $('ph-pct').textContent = pct + '%';
        $('ph-sub').textContent = `白天进度 ${pct}% · 太阳在地平线上 ${phase.altDeg.toFixed(1)}°（${fmtHM(dn.start)} 出 → ${fmtHM(dn.end)} 落）`;
        $('ph-fill').style.width = pct + '%';
      } else {
        $('ph-pct').textContent = '';
        $('ph-sub').textContent = `太阳在地平线上 ${phase.altDeg.toFixed(1)}°`;
        $('ph-fill').style.width = '100%';
      }
    } else if (phase.kind === 'night') {
      const dn = dayNightProgress(now, state.lat, state.lng, 'night');
      $('ph-name').innerHTML = '🌑 夜晚';
      if (dn) {
        const pct = Math.round(dn.pct * 100);
        $('ph-pct').textContent = pct + '%';
        $('ph-sub').textContent = `夜晚进度 ${pct}% · 太阳在地平线下 ${(-phase.altDeg).toFixed(1)}°（${fmtHM(dn.start)} 天文暮 → ${fmtHM(dn.end)} 天文晨）`;
        $('ph-fill').style.width = pct + '%';
      } else {
        $('ph-pct').textContent = '';
        $('ph-sub').textContent = `太阳在地平线下 ${(-phase.altDeg).toFixed(1)}°`;
        $('ph-fill').style.width = '0%';
      }
    } else {
      const isDawn = phase.kind === 'dawn';
      $('ph-name').innerHTML = (isDawn ? '🌄 日出中' : '🌆 日落中') +
        ' · ' + phase.segName + (isDawn ? '晨光' : '暮光');
      const overallPct = Math.round(phase.overallPct * 100);
      const segPct = Math.round(phase.pct * 100);
      $('ph-pct').textContent = overallPct + '%';
      $('ph-sub').textContent = `${isDawn ? '日出' : '日落'}整体进度 · 太阳高度 ${phase.altDeg.toFixed(2)}°（当前段 ${phase.segLow}° ~ ${phase.segHigh}°，段内 ${segPct}%）`;
      $('ph-fill').style.width = overallPct + '%';
    }

    // 光照曲线
    const illum = buildIllumChart(now, state.lat, state.lng);
    $('illum-card').hidden = false;
    $('illum-chart').innerHTML = illum.svgInner;
    $('illum-cur').textContent = fmtLux(illum.curLux);
    $('illum-max').textContent = fmtLux(illum.maxLux);
    $('illum-pct').textContent = fmtPct(illum.pct);

    // 两组
    const riseRaw = findNextEvent(now, state.lat, state.lng, 'rise');
    const setRaw  = findNextEvent(now, state.lat, state.lng, 'set');
    const riseItems = riseRaw.slice().sort((a, b) => a.angle.alt - b.angle.alt);
    const setItems  = setRaw.slice().sort((a, b) => b.angle.alt - a.angle.alt);

    let riseFirst;
    if (phase.kind === 'dawn')      riseFirst = true;
    else if (phase.kind === 'dusk') riseFirst = false;
    else {
      const riseHoriz = riseItems.find(i => i.angle.key === 'horiz').time;
      const setHoriz  = setItems.find(i => i.angle.key === 'horiz').time;
      const riseTtl = riseHoriz ? (riseHoriz - now) : Infinity;
      const setTtl  = setHoriz  ? (setHoriz  - now) : Infinity;
      riseFirst = riseTtl <= setTtl;
    }

    $('group-before').innerHTML = riseFirst ? buildGroupHTML('rise', riseItems, phase) : buildGroupHTML('set', setItems, phase);
    $('group-after').innerHTML  = riseFirst ? buildGroupHTML('set', setItems, phase)  : buildGroupHTML('rise', riseItems, phase);

    // 3D 场景更新
    if (window.SunScene && window.SunScene.update) {
      window.SunScene.update(now, state.lat, state.lng);
    }

    $('meta').hidden = false;
  }

  function onLocation(lat, lng, source) {
    state.lat = lat; state.lng = lng;
    state.posUpdatedAt = new Date();
    state.posSource = source || '';
    try { localStorage.setItem('sunPos', JSON.stringify({ lat, lng })); } catch (_) {}
    setStatus('');
    render();
    lookupAddress(lat, lng);
  }

  function requestGeoOnce(silent) {
    if (!('geolocation' in navigator)) {
      setStatus('当前浏览器不支持定位 API。', true);
      $('manual').hidden = false;
      return;
    }
    if (!silent) setStatus('正在获取位置… 请在弹窗中允许');
    navigator.geolocation.getCurrentPosition(
      pos => {
        onLocation(pos.coords.latitude, pos.coords.longitude, '浏览器定位');
        $('manual').hidden = true;
      },
      err => {
        if (state.lat != null) return;
        let msg = '获取位置失败：' + (err && err.message ? err.message : '未知错误');
        if (location.protocol === 'file:') {
          msg += '（file:// 下定位被禁用，请用 HTTPS 打开或手动输入）';
        }
        setStatus(msg, true);
        $('manual').hidden = false;
        try {
          const saved = JSON.parse(localStorage.getItem('sunPos') || 'null');
          if (saved && typeof saved.lat === 'number' && typeof saved.lng === 'number') {
            $('in-lat').value = saved.lat;
            $('in-lng').value = saved.lng;
            onLocation(saved.lat, saved.lng, '上次手动输入');
          }
        } catch (_) {}
      },
      { enableHighAccuracy: false, timeout: 12000, maximumAge: 60 * 1000 }
    );
  }

  function startPosAutoRefresh() {
    if (state.posRefreshTimer) clearInterval(state.posRefreshTimer);
    state.posRefreshTimer = setInterval(() => requestGeoOnce(true), POS_REFRESH_MS);
  }

  $('btn-go').addEventListener('click', () => {
    const lat = parseFloat($('in-lat').value);
    const lng = parseFloat($('in-lng').value);
    if (!isFinite(lat) || !isFinite(lng) || lat < -90 || lat > 90 || lng < -180 || lng > 180) {
      setStatus('请输入有效的纬度 (-90~90) 和经度 (-180~180)。', true);
      return;
    }
    onLocation(lat, lng, '手动输入');
  });

  $('btn-refresh').addEventListener('click', () => requestGeoOnce(false));

  setInterval(() => { if (state.lat != null) render(); }, 1000);

  requestGeoOnce(false);
  startPosAutoRefresh();

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && state.lat != null) {
      requestGeoOnce(true);
    }
  });
})();
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const SunScene = {
  ready: false,
  scene: null, camera: null, renderer: null, controls: null,
  trajGroup: null, sunMesh: null, sunGlow: null,
  lastLat: null, lastLng: null,
  cameraOriented: false,

  init(container) {
    if (this.ready) return;
    const w = container.clientWidth || 320;
    const h = w;

    this.scene = new THREE.Scene();

    this.camera = new THREE.PerspectiveCamera(45, w / h, 0.01, 100);
    this.camera.position.set(0, 1.2, 2.6);

    this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    this.renderer.setSize(w, h);
    this.renderer.setClearColor(0x000000, 0);
    container.innerHTML = '';
    container.appendChild(this.renderer.domElement);

    this.controls = new OrbitControls(this.camera, this.renderer.domElement);
    this.controls.target.set(0, 0, 0);
    this.controls.enableDamping = true;
    this.controls.dampingFactor = 0.12;
    this.controls.minDistance = 1.4;
    this.controls.maxDistance = 6;
    this.controls.enablePan = false;
    this.controls.enableZoom = true;
    this.controls.rotateSpeed = 0.8;
    this.controls.autoRotate = true;
    this.controls.autoRotateSpeed = 0.6;
    this.controls.addEventListener('start', () => { this.controls.autoRotate = false; });

    // 地平面（半透明圆盘）
    const groundGeom = new THREE.CircleGeometry(1.0, 96);
    groundGeom.rotateX(-Math.PI / 2);
    this.scene.add(new THREE.Mesh(groundGeom,
      new THREE.MeshBasicMaterial({ color: 0x1a2a4f, transparent: true, opacity: 0.35, side: THREE.DoubleSide })));

    // 地平线圆环
    const ringGeom = new THREE.RingGeometry(0.995, 1.012, 96);
    ringGeom.rotateX(-Math.PI / 2);
    this.scene.add(new THREE.Mesh(ringGeom,
      new THREE.MeshBasicMaterial({ color: 0x7a96c8, side: THREE.DoubleSide })));

    // 子午线/方位环（很淡）
    const meridGeom = new THREE.RingGeometry(0.998, 1.002, 96);
    const merid1 = new THREE.Mesh(meridGeom, new THREE.MeshBasicMaterial({ color: 0x3a4a70, transparent: true, opacity: 0.25, side: THREE.DoubleSide }));
    merid1.rotation.set(0, 0, Math.PI / 2);  // E-W vertical great circle
    this.scene.add(merid1);
    const merid2 = new THREE.Mesh(meridGeom, new THREE.MeshBasicMaterial({ color: 0x3a4a70, transparent: true, opacity: 0.25, side: THREE.DoubleSide }));
    merid2.rotation.set(Math.PI / 2, 0, 0);  // N-S vertical great circle
    this.scene.add(merid2);

    // 方位标签
    this.scene.add(this._makeLabel('N', 0, 0.04, -1.13, '#ffd87b'));
    this.scene.add(this._makeLabel('S', 0, 0.04,  1.13, '#9aa8c8'));
    this.scene.add(this._makeLabel('E', 1.13, 0.04, 0,  '#9aa8c8'));
    this.scene.add(this._makeLabel('W', -1.13, 0.04, 0, '#9aa8c8'));
    // 头顶/天底标
    this.scene.add(this._makeLabel('天顶', 0, 1.1, 0, '#6cb6ff'));

    // 轨迹容器
    this.trajGroup = new THREE.Group();
    this.scene.add(this.trajGroup);

    // 太阳
    const sunGeom = new THREE.SphereGeometry(0.05, 32, 24);
    const sunMat = new THREE.MeshBasicMaterial({ color: 0xffe27a });
    this.sunMesh = new THREE.Mesh(sunGeom, sunMat);
    this.scene.add(this.sunMesh);

    // 光晕
    const glowGeom = new THREE.SphereGeometry(0.12, 24, 16);
    const glowMat = new THREE.MeshBasicMaterial({ color: 0xff8e5a, transparent: true, opacity: 0.25 });
    this.sunGlow = new THREE.Mesh(glowGeom, glowMat);
    this.scene.add(this.sunGlow);

    // 运动方向箭头（尾在太阳，头指向未来 15 分钟方向）
    this.sunArrow = new THREE.ArrowHelper(
      new THREE.Vector3(1, 0, 0),
      new THREE.Vector3(0, 0, 0),
      0.2,
      0xffe27a,
      0.06,
      0.035
    );
    this.scene.add(this.sunArrow);

    // 天顶杆
    const zenithGeom = new THREE.CylinderGeometry(0.002, 0.002, 1.0, 8);
    const zenithMat = new THREE.MeshBasicMaterial({ color: 0x3a4a70, transparent: true, opacity: 0.4 });
    const zenithRod = new THREE.Mesh(zenithGeom, zenithMat);
    zenithRod.position.set(0, 0.5, 0);
    this.scene.add(zenithRod);

    // resize
    const onResize = () => {
      const w = container.clientWidth || 320;
      const h = w;
      this.renderer.setSize(w, h);
      this.camera.aspect = w / h;
      this.camera.updateProjectionMatrix();
    };
    window.addEventListener('resize', onResize);
    const ro = new ResizeObserver(onResize);
    ro.observe(container);

    // 动画
    const animate = () => {
      requestAnimationFrame(animate);
      this.controls.update();
      this.renderer.render(this.scene, this.camera);
    };
    animate();

    this.ready = true;
  },

  _makeLabel(text, x, y, z, color) {
    const canvas = document.createElement('canvas');
    canvas.width = 128; canvas.height = 128;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = color || '#9aa8c8';
    const fontSize = text.length > 1 ? 48 : 80;
    ctx.font = `bold ${fontSize}px -apple-system, "PingFang SC", sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(text, 64, 64);
    const tex = new THREE.CanvasTexture(canvas);
    tex.needsUpdate = true;
    const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false });
    const sprite = new THREE.Sprite(mat);
    sprite.position.set(x, y, z);
    sprite.scale.set(0.2, 0.2, 1);
    return sprite;
  },

  _altAzToXYZ(alt, az) {
    // az: SunCalc 弧度（从南起，西正） → compass = π + az（从北起顺时针）
    const compassAz = Math.PI + az;
    return new THREE.Vector3(
      Math.cos(alt) * Math.sin(compassAz),
      Math.sin(alt),
      -Math.cos(alt) * Math.cos(compassAz)
    );
  },

  _disposeTraj() {
    while (this.trajGroup.children.length > 0) {
      const m = this.trajGroup.children.pop();
      if (m.geometry) m.geometry.dispose();
      if (m.material) m.material.dispose();
    }
  },

  update(now, lat, lng) {
    if (!this.ready || !window.__sun) return;
    const getSunPos = window.__sun.getSunPos;

    // 摄像机初始朝向：根据纬度让太阳一侧在前方
    if (!this.cameraOriented) {
      // 南半球太阳在北方（-Z），相机站南；北半球太阳在南方（+Z），相机站北
      const z = lat < 0 ? 2.6 : -2.6;
      this.camera.position.set(0, 1.2, z);
      this.controls.update();
      this.cameraOriented = true;
    }

    // 仅在位置变化时重建轨迹
    if (lat !== this.lastLat || lng !== this.lastLng) {
      this.lastLat = lat; this.lastLng = lng;
      this._disposeTraj();

      // 采样 24h
      const samples = [];
      for (let m = -12 * 60; m <= 12 * 60; m += 5) {
        const t = new Date(now.getTime() + m * 60000);
        const p = getSunPos(t, lat, lng);
        const v = this._altAzToXYZ(p.alt, p.az);
        samples.push({ alt: p.alt, v });
      }

      // 拆段：alt>=0 是白天，<0 是地平线下
      const segs = [];
      let cur = null;
      for (const s of samples) {
        const isUp = s.alt >= 0;
        if (!cur || cur.up !== isUp) {
          if (cur && cur.pts.length >= 2) segs.push(cur);
          cur = { up: isUp, pts: [] };
        }
        cur.pts.push(s.v);
      }
      if (cur && cur.pts.length >= 2) segs.push(cur);

      // 每段做 Tube
      segs.forEach(seg => {
        if (seg.pts.length < 2) return;
        const curve = new THREE.CatmullRomCurve3(seg.pts, false);
        const tubeR = seg.up ? 0.009 : 0.006;
        const tubeMat = new THREE.MeshBasicMaterial({
          color: seg.up ? 0xffd87b : 0x5a6a90,
          transparent: !seg.up,
          opacity: seg.up ? 1 : 0.7,
        });
        const tubeGeom = new THREE.TubeGeometry(curve, seg.pts.length * 2, tubeR, 8, false);
        this.trajGroup.add(new THREE.Mesh(tubeGeom, tubeMat));
      });

      // 每 3 小时小球标记
      for (let m = -12 * 60; m <= 12 * 60; m += 180) {
        const t = new Date(now.getTime() + m * 60000);
        const p = getSunPos(t, lat, lng);
        const v = this._altAzToXYZ(p.alt, p.az);
        const tickGeom = new THREE.SphereGeometry(0.012, 12, 8);
        const tickMat = new THREE.MeshBasicMaterial({
          color: p.alt >= 0 ? 0xffb86b : 0x5a6a90,
          transparent: p.alt < 0, opacity: p.alt >= 0 ? 1 : 0.7,
        });
        const tick = new THREE.Mesh(tickGeom, tickMat);
        tick.position.copy(v);
        this.trajGroup.add(tick);
      }
    }

    // 更新当前太阳位置
    const sunPos = getSunPos(now, lat, lng);
    const v = this._altAzToXYZ(sunPos.alt, sunPos.az);
    this.sunMesh.position.copy(v);
    this.sunGlow.position.copy(v);
    this.sunGlow.material.opacity = sunPos.alt >= 0 ? 0.35 : 0.15;
    this.sunMesh.material.color.setHex(sunPos.alt >= 0 ? 0xffe27a : 0xff8e5a);

    // 运动方向箭头：取当前 → 未来 15 分钟的方向
    const futureT = new Date(now.getTime() + 15 * 60 * 1000);
    const futurePos = getSunPos(futureT, lat, lng);
    const futureV = this._altAzToXYZ(futurePos.alt, futurePos.az);
    const dir = futureV.clone().sub(v);
    const dirLen = dir.length();
    if (dirLen > 1e-6) {
      dir.divideScalar(dirLen);
      this.sunArrow.position.copy(v);
      this.sunArrow.setDirection(dir);
      this.sunArrow.setLength(0.22, 0.07, 0.04);
      this.sunArrow.visible = true;
    } else {
      this.sunArrow.visible = false;
    }
  },
};

window.SunScene = SunScene;

const container = document.getElementById('sky3d-canvas');
if (container) {
  try {
    SunScene.init(container);
  } catch (e) {
    container.innerHTML = '<div class="sky3d-loading">3D 加载失败：' + (e.message || e) + '</div>';
  }
}
</script>
</body>
</html>
