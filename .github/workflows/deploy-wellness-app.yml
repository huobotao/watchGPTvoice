name: Deploy wellness-app to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/wellness-education-app-mG2qP
    paths:
      - 'wellness-app/frontend/**'
      - '.github/workflows/deploy-wellness-app.yml'
  workflow_dispatch:

# Required by github-pages deploy action.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one live deploy at a time; cancel in-flight runs on push.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wellness-app/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: wellness-app/frontend/package-lock.json

      - run: npm ci

      - name: Build
        env:
          # GitHub Pages serves project sites under /<repo>/.
          PUBLIC_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      # configure-pages with enablement:true only CREATES a Pages site if none
      # exists — it does NOT change build_type on an already-enabled site. This
      # repo had Pages pre-configured as "deploy from branch main/(root)", which
      # kept serving the legacy GPT files at /. Force build_type=workflow so the
      # artifact uploaded below is what gets served.
      - name: Force Pages source to GitHub Actions
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          if gh api "repos/$REPO/pages" >/dev/null 2>&1; then
            gh api -X PUT "repos/$REPO/pages" -f build_type=workflow
          else
            gh api -X POST "repos/$REPO/pages" -f build_type=workflow
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: wellness-app/frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
