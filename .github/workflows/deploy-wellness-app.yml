name: Deploy wellness-app to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/wellness-education-app-mG2qP
    paths:
      - 'wellness-app/frontend/**'
      - '.github/workflows/deploy-wellness-app.yml'
  workflow_dispatch:

# Required by github-pages deploy action.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one live deploy at a time; cancel in-flight runs on push.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wellness-app/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: wellness-app/frontend/package-lock.json

      - run: npm ci

      - name: Build
        env:
          # GitHub Pages serves project sites under /<repo>/.
          PUBLIC_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - uses: actions/configure-pages@v5
        with:
          # First run will enable Pages on the repo and set Source = GitHub Actions
          # automatically, so no manual click in repo Settings is required.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: wellness-app/frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
